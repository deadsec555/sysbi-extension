<!doctype html>
<html lang="en" data-composition-variables='[{"id": "cta", "type": "string", "label": "Call to action", "default": "Thinking of moving? Let&#39;s talk."}, {"id": "name", "type": "string", "label": "Agent name", "default": "Alex Morgan"}, {"id": "phone", "type": "string", "label": "Phone", "default": "(555) 010-2030"}, {"id": "site", "type": "string", "label": "Website", "default": "morganrealty.com"}]'>
<head><meta charset="UTF-8" />
<meta name="viewport" content="width={{W}}, height={{H}}" />
<script src="gsap.min.js"></script>
<style>
@font-face{font-family:Montserrat;font-weight:700;src:url(fonts/montserrat-latin-700-normal.woff2)}
@font-face{font-family:Montserrat;font-weight:800;src:url(fonts/montserrat-latin-800-normal.woff2)}
@font-face{font-family:Montserrat;font-weight:900;src:url(fonts/montserrat-latin-900-normal.woff2)}
@font-face{font-family:Poppins;font-weight:400;src:url(fonts/poppins-latin-400-normal.woff2)}
@font-face{font-family:Poppins;font-weight:600;src:url(fonts/poppins-latin-600-normal.woff2)}
:root{--panel:rgba(11,11,15,.88);--text:#FFFFFF;--muted:#B8B8C0;--accent:#FFD60A;--accent-ink:#0B0B0F}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:{{W}}px;height:{{H}}px;overflow:hidden;background:transparent}
#root{position:relative;width:100%;height:100%;font-family:Poppins,sans-serif;color:var(--text)}
h1,h2,h3,.head{font-family:Montserrat,sans-serif;font-weight:800;letter-spacing:-.01em}
#c{position:absolute;inset:0;background:#0B0B0F;padding:10vmin} h2{font-size:7vmin;line-height:1.08;max-width:60%} .hl{color:var(--accent)} .contact{margin-top:5vmin;display:flex;flex-direction:column;gap:1.4vmin} .row{font-size:3.4vmin;font-weight:600} .row b{color:var(--accent);font-family:Montserrat;font-weight:800;margin-right:1.4vmin}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="{{W}}" data-height="{{H}}">
<div id="c"><h2 data-var="cta"></h2><div class="contact"><div class="row" id="r1"><b>●</b><span data-var="name"></span></div><div class="row" id="r2"><b>●</b><span data-var="phone"></span></div><div class="row" id="r3"><b>●</b><span data-var="site"></span></div></div></div>
</div>
<script>
const v = window.__hyperframes.getVariables();
document.querySelectorAll("[data-var]").forEach(el => { el.textContent = v[el.dataset.var] ?? ""; });
document.querySelectorAll("[data-hide-empty]").forEach(el => { if (!v[el.dataset.hideEmpty]) el.style.display = "none"; });
const tl = gsap.timeline({ paused: true });
tl.from("h2",{y:40,opacity:0,duration:.5,ease:"power3.out"},.2).from(".row",{x:-30,opacity:0,duration:.35,stagger:.15},.6).to("#c",{opacity:0,duration:.4},5.6);
window.__timelines["main"] = tl; tl.seek(0);
</script></body></html>
