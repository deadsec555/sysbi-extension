<!doctype html>
<html lang="en" data-composition-variables='[{"id": "brand", "type": "string", "label": "Brand text", "default": "MORGAN & CO."}, {"id": "tagline", "type": "string", "label": "Tagline", "default": "Real Estate"}]'>
<head><meta charset="UTF-8" />
<meta name="viewport" content="width={{W}}, height={{H}}" />
<script src="gsap.min.js"></script>
<style>
@font-face{font-family:Montserrat;font-weight:700;src:url(fonts/montserrat-latin-700-normal.woff2)}
@font-face{font-family:Montserrat;font-weight:800;src:url(fonts/montserrat-latin-800-normal.woff2)}
@font-face{font-family:Montserrat;font-weight:900;src:url(fonts/montserrat-latin-900-normal.woff2)}
@font-face{font-family:Poppins;font-weight:400;src:url(fonts/poppins-latin-400-normal.woff2)}
@font-face{font-family:Poppins;font-weight:600;src:url(fonts/poppins-latin-600-normal.woff2)}
:root{--panel:rgba(11,11,15,.88);--text:#FFFFFF;--muted:#B8B8C0;--accent:#FFD60A;--accent-ink:#0B0B0F}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:{{W}}px;height:{{H}}px;overflow:hidden;background:transparent}
#root{position:relative;width:100%;height:100%;font-family:Poppins,sans-serif;color:var(--text)}
h1,h2,h3,.head{font-family:Montserrat,sans-serif;font-weight:800;letter-spacing:-.01em}
#c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0B0B0F} img{max-width:46vmin;max-height:26vmin} .brand{font-family:Montserrat;font-weight:900;font-size:9vmin;letter-spacing:.06em} .tag{color:var(--accent);font-family:Montserrat;font-weight:700;font-size:3vmin;letter-spacing:.4em;margin-top:1.6vmin;text-transform:uppercase} .line{height:.6vmin;width:0;background:var(--accent);margin-top:2vmin}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="2.5" data-width="{{W}}" data-height="{{H}}">
<div id="c"><img id="logo" src="logo.png" onerror="this.remove()" /><div class="brand" data-var="brand"></div><div class="line"></div><div class="tag" data-var="tagline" data-hide-empty="tagline"></div></div>
</div>
<script>
const v = window.__hyperframes.getVariables();
document.querySelectorAll("[data-var]").forEach(el => { el.textContent = v[el.dataset.var] ?? ""; });
document.querySelectorAll("[data-hide-empty]").forEach(el => { if (!v[el.dataset.hideEmpty]) el.style.display = "none"; });
const tl = gsap.timeline({ paused: true });
if (document.getElementById("logo")) document.querySelector(".brand").style.display="none";
tl.from("#logo, .brand",{scale:.6,opacity:0,duration:.5,ease:"back.out(2)"},.2).to(".line",{width:"30vmin",duration:.45,ease:"power2.out"},.55).from(".tag",{opacity:0,y:12,duration:.35},.75).to("#c",{opacity:0,duration:.35},2.15);
window.__timelines["main"] = tl; tl.seek(0);
</script></body></html>
