<!doctype html>
<html lang="en" data-composition-variables='[{"id": "price", "type": "string", "label": "Price", "default": "$725,000"}, {"id": "beds", "type": "string", "label": "Beds", "default": "4 Beds"}, {"id": "baths", "type": "string", "label": "Baths", "default": "3 Baths"}, {"id": "area", "type": "string", "label": "Area", "default": "2,450 sq ft"}, {"id": "address", "type": "string", "label": "Address line", "default": "128 Maple Ave, Riverside"}]'>
<head><meta charset="UTF-8" />
<meta name="viewport" content="width={{W}}, height={{H}}" />
<script src="gsap.min.js"></script>
<style>
@font-face{font-family:Montserrat;font-weight:700;src:url(fonts/montserrat-latin-700-normal.woff2)}
@font-face{font-family:Montserrat;font-weight:800;src:url(fonts/montserrat-latin-800-normal.woff2)}
@font-face{font-family:Montserrat;font-weight:900;src:url(fonts/montserrat-latin-900-normal.woff2)}
@font-face{font-family:Poppins;font-weight:400;src:url(fonts/poppins-latin-400-normal.woff2)}
@font-face{font-family:Poppins;font-weight:600;src:url(fonts/poppins-latin-600-normal.woff2)}
:root{--panel:rgba(11,11,15,.88);--text:#FFFFFF;--muted:#B8B8C0;--accent:#FFD60A;--accent-ink:#0B0B0F}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:{{W}}px;height:{{H}}px;overflow:hidden;background:transparent}
#root{position:relative;width:100%;height:100%;font-family:Poppins,sans-serif;color:var(--text)}
h1,h2,h3,.head{font-family:Montserrat,sans-serif;font-weight:800;letter-spacing:-.01em}
#card{position:absolute;right:6vmin;bottom:8vmin;background:var(--panel);border-radius:2vmin;padding:3vmin 3.6vmin;min-width:46vmin;box-shadow:0 2vmin 6vmin rgba(0,0,0,.4)} .price{font-family:Montserrat;font-weight:900;font-size:8vmin;color:var(--accent);line-height:1} .addr{font-size:2.8vmin;color:var(--muted);margin-top:1vmin} .specs{display:flex;gap:1.4vmin;margin-top:2.4vmin} .spec{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:1vmin;padding:1vmin 1.8vmin;font-weight:600;font-size:3vmin;white-space:nowrap}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="{{W}}" data-height="{{H}}">
<div id="card"><div class="price" data-var="price"></div><div class="addr" data-var="address" data-hide-empty="address"></div><div class="specs"><div class="spec" data-var="beds"></div><div class="spec" data-var="baths"></div><div class="spec" data-var="area"></div></div></div>
</div>
<script>
const v = window.__hyperframes.getVariables();
document.querySelectorAll("[data-var]").forEach(el => { el.textContent = v[el.dataset.var] ?? ""; });
document.querySelectorAll("[data-hide-empty]").forEach(el => { if (!v[el.dataset.hideEmpty]) el.style.display = "none"; });
const tl = gsap.timeline({ paused: true });
tl.from("#card",{y:40,opacity:0,scale:.92,duration:.45,ease:"back.out(1.6)"},.15).from(".price",{opacity:0,y:20,duration:.35},.3).from(".addr",{opacity:0,duration:.3},.45).from(".spec",{scale:.4,opacity:0,duration:.3,ease:"back.out(2.4)",stagger:.15},.55).to("#card",{opacity:0,y:30,duration:.35,ease:"power2.in"},4.5);
window.__timelines["main"] = tl; tl.seek(0);
</script></body></html>
